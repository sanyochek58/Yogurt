ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.yogurtvpn.ApplicationMainKt.module ]
    }
}

db {
    jdbcUrl  = "jdbc:postgresql://localhost:5432/yogurtvpn"
    jdbcUrl  = ${?DB_JDBC_URL}
    username = "yogurt"
    username = ${?DB_USERNAME}
    password = "yogurt_local"
    password = ${?DB_PASSWORD}
}

jwt {
    secret   = "local-dev-secret-not-for-production"
    secret   = ${?JWT_SECRET}
    issuer   = "yogurtvpn"
    audience = "yogurtvpn-users"
}

xray {
    serverHost = "localhost"
    serverHost = ${?XRAY_SERVER_HOST}
    serverPort = 443
    serverPort = ${?XRAY_SERVER_PORT}
    publicKey  = "local-public-key"
    publicKey  = ${?XRAY_PUBLIC_KEY}
    shortId    = "local-short-id"
    shortId    = ${?XRAY_SHORT_ID}
}

email {
    host     = "smtp.yandex.ru"
    host     = ${?EMAIL_HOST}
    port     = 465
    port     = ${?EMAIL_PORT}
    username = "local@yandex.ru"
    username = ${?EMAIL_USERNAME}
    password = "local-password"
    password = ${?EMAIL_PASSWORD}
    from     = "local@yandex.ru"
    from     = ${?EMAIL_FROM}
}