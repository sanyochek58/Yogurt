services:
  postgres:
    image: postgres:16-alpine
    container_name: yogurt-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: yogurtvpn
      POSTGRES_USER: yogurt
      POSTGRES_PASSWORD: yogurt_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data: